name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node checks and pack (dsh ${{ matrix.dsh }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.1.5-rc.1', '0.1.5-rc.2']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
      - name: Install exact dsh host
        env:
          DSH_VERSION: ${{ matrix.dsh }}
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh-host" --no-audit --no-fund "@deepseek-ai/dsh@$DSH_VERSION"
          echo "DSH_BIN=$RUNNER_TEMP/dsh-host/node_modules/.bin/dsh" >> "$GITHUB_ENV"
      # Exercises package installation and Web startup with SAG unavailable.
      # Real SAG deployments, Python runtime and Windows are separate acceptance gates.
      - name: Verify packed plugin with selected host
        run: pnpm run check:pack
